<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking - Quiz Belieber</title>

    <link rel="stylesheet" href="/css/resultados.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="card">

        <div class="fotos">
            <img src="/img/justin2.jpg" alt="Justin bebê">
            <img src="/img/justin1.webp" alt="Justin jovem">
            <img src="/img/justin.webp" alt="Justin adulto">
        </div>

        <h1>RANKING DOS <span>BELIEBERS</span></h1>

        <p class="sub">Veja quem mais conhece o Justin. Você pode editar ou excluir cada resultado.</p>

        <div class="stats">
            <div class="stat">
                <strong id="stat-total">0</strong>
                <span>participantes</span>
            </div>
            <div class="stat">
                <strong id="stat-media">0</strong>
                <span>média de pontos</span>
            </div>
            <div class="stat">
                <strong id="stat-melhor">0/5</strong>
                <span>melhor nota</span>
            </div>
        </div>

        <p id="aviso" class="aviso"></p>

        <div id="lista" class="lista"></div>

        <div class="rodape">
            <a href="/index.html">Jogar o quiz</a>
        </div>

    </div>

    <script src="/js/resultados.js"></script>

</body>

</html>
